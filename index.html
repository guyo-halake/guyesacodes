          <p>Guyo Halake is a Cloud Software Developer specialized in Microsoft Azure. Over the past few years, his work has expanded from full-stack web applications with React and JavaScript to Cloud and DevOps—containerizing applications with Docker, building automated CI/CD pipelines, and deploying and monitoring resilient systems on Microsoft Azure.</p>
          <p>In freelance and commercial projects, Guyo builds autonomous AI agents and workflow automations using n8n, custom Python scripts, RAG knowledge retrieval, and MCP (Model Context Protocol) integrations—including legal billing SaaS platforms and WhatsApp customer bots with real-time Safaricom Daraja M-Pesa payments.</p>
        </section>

            <p>Repository: <a href="https://github.com/guyo-halake/nyagakithinji-Bill-of-Costs.git">https://github.com/guyo-halake/nyagakithinji-Bill-of-Costs.git</a></p>
